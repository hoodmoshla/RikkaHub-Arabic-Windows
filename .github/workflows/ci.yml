name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pc-server-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install pc-server dependencies
        working-directory: pc-server
        run: bun install --frozen-lockfile

      - name: Type check pc-server
        working-directory: pc-server
        run: bun run typecheck

      - name: Run request-chain smoke
        working-directory: pc-server
        run: bun run smoke:request-chain

      - name: Run backup roundtrip smoke
        working-directory: pc-server
        run: bun run smoke:backup-roundtrip

      - name: Check version consistency
        working-directory: pc-server
        run: bun run scripts/check-version-sync.ts

  web-ui-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: bun install --frozen-lockfile

      - name: Type check web-ui
        working-directory: web-ui
        run: bun run typecheck

      - name: Build web-ui
        working-directory: web-ui
        run: bun run build
