name: Windows build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install web UI dependencies
        working-directory: web-ui
        run: bun install --frozen-lockfile

      - name: Install PC server dependencies
        working-directory: pc-server
        run: bun install --frozen-lockfile

      - name: Build PC server sidecar
        run: bun run --cwd pc-server compile

      - name: Build Windows installer
        working-directory: web-ui
        run: bun run tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-windows-installer
          path: web-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
